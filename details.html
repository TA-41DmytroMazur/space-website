          { label: "Корисне навантаження", val: "До 64 тонн на низьку орбіту" },
          { label: "Місячна місія", val: "Artemis III (пілотована висадка)" },
          { label: "Перспективна мета", val: "Політ на Марс у 2030-х роках" }
        ],
        trivia: "💡 <strong>Неймовірний факт:</strong> Перші ступені важкої ракети Falcon Heavy повертаються назад на Землю самостійно і синхронно здійснюють вертикальну посадку на реактивних двигунах, заощаджуючи десятки мільйонів доларів на кожному пуску!"
      }
    };

    // Отримання ID з рядка запиту URL (?id=mars)
    const urlParams = new URLSearchParams(window.location.search);
    const objectId = urlParams.get('id') || 'mars';
    const currentData = spaceData[objectId] || spaceData['mars'];

    // Заповнення текстового контенту
    document.title = "КосмоСвіт — " + currentData.title;
    document.getElementById('objectTag').textContent = currentData.tag;
    document.getElementById('objectTitle').textContent = currentData.title;
    document.getElementById('objectStory').innerHTML = currentData.story;
    document.getElementById('objectTrivia').innerHTML = currentData.trivia;

    // Головне фото
    const mainImg = document.getElementById('mainImage');
    mainImg.src = currentData.mainImage;
    mainImg.alt = currentData.title;

    // Заповнення характеристик
    const specsContainer = document.getElementById('objectSpecs');
    specsContainer.innerHTML = '';
    currentData.specs.forEach(s => {
      const item = document.createElement('div');
      item.innerHTML = `<span>${s.label}:</span> <strong>${s.val}</strong>`;
      specsContainer.appendChild(item);
    });

    // Заповнення виключно власних мініатюр вибраного об'єкта
    const thumbsContainer = document.getElementById('thumbsContainer');
    thumbsContainer.innerHTML = '';
    currentData.thumbs.forEach((t, index) => {
      const thumb = document.createElement('img');
      thumb.src = t.src;
      thumb.alt = t.label;
      thumb.title = t.label;
      thumb.className = "detail-thumb-img";
      if (index === 0) {
        thumb.style.borderColor = "#38bdf8";
      }
      thumb.onclick = function() {
        mainImg.src = t.src;
        // Підсвічуємо активну мініатюру
        document.querySelectorAll('.detail-thumb-img').forEach(el => el.style.borderColor = "#334155");
        thumb.style.borderColor = "#38bdf8";
      };
      thumbsContainer.appendChild(thumb);
    });
  </script>

    </div>
  </footer>
